[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "swapprint"
version = "0.2.1"
description = "Detect tampering in digital artwork with quantum fingerprints and SWAP tests (IBM Qiskit Fall Fest 2026)."
requires-python = ">=3.11"

[tool.setuptools]
packages = ["swapprint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: timing tests (skip them with -m \"not slow\")"]
