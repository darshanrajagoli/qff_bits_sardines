[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "swapprint"
version = "0.3.0"
description = "Detect tampering in digital artwork with quantum fingerprints and SWAP tests (IBM Qiskit Fall Fest 2026)."
requires-python = ">=3.12"

[tool.setuptools]
packages = ["swapprint"]

[tool.setuptools.package-data]
swapprint = ["fonts/*.ttf", "fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: timing tests (skip them with -m \"not slow\")"]
